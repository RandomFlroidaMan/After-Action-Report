services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: aar
      POSTGRES_PASSWORD: aar_local_only
      POSTGRES_DB: aar
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - aar-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aar -d aar']
      interval: 3s
      retries: 20
volumes:
  aar-db:
